name: domo
description: App de gestão doméstica para famílias e grupos.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.7
  firebase_analytics: ^11.4.4
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Auth
  google_sign_in: ^6.2.0

  # Images (somente cache de URL — Storage adiado para fase futura)
  cached_network_image: ^3.4.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

  # Testing
  fake_cloud_firestore: ^3.1.0
  mocktail: ^1.0.4

  # Code generation
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.4
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  image_path: "assets/icons/icon.png"

  # Android
  android: true
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  adaptive_icon_background: "#EEF1F1"

  # iOS (caso queira no futuro)
  ios: false

  # Web — gera favicon + manifest icons
  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#EEF1F1"
    theme_color: "#2C4A7C"
